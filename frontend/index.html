<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posts</title>
    <style>
        #form-post { border: 1px solid #ccc; padding: 1rem; margin-bottom: 2rem; }
        #form-post input, #form-post textarea { display: block; margin: 0.5rem 0; width: 100%; }
        #posts { display: flex; flex-direction: column; gap: 1rem; }
        .post { border: 1px solid #ddd; padding: 1rem; border-radius: 6px; }
        .post img { max-width: 200px; }
    </style>
</head>
<body>
    <header>
        <button type="button" onclick="window.location.reload()">Refresh Page</button>
    </header>
    <main>
        <section id="form-post">
            <h2>Create new post</h2>
            <form id="create-post-form">
                <input type="text" id="title" placeholder="Title" required />
                <textarea id="content" placeholder="Content" required></textarea>
                
                <input type="number" id="user_id" placeholder="yourID"/>
                <button type="submit">Create Post</button>
            </form>
        </section>
        <section id="posts"></section>
    </main>

    <script type="module">
        async function loadPosts() {
            const postsContainer = document.querySelector("#posts");
            postsContainer.innerHTML = ""; 

            try {
                const response = await fetch("http://localhost:6767/posts");
                const json_arr = await response.json();

                for (const post of json_arr) {
                    const postDiv = document.createElement("div");
                    postDiv.className = "post";
                    postDiv.id = `post-${post.id}`;
                    const parts = new Date(post.timestamp).toLocaleDateString('en-US', {
                        year:"numeric",
                        month:"short",
                        day:"2-digit"
                    }).split(' ');
                    const release_date = `${parts[2]} ${parts[0]}, ${parts[1].replace(',', '')}`;
                    postDiv.innerHTML = `
                        <h1>${post.title}</h1>
                        <p style="font-size:30px"><i>${post.author} | ${release_date}</i></p>
                        <div><p>${post.content}</p></div>
                        <p id="likes-display-${post.id}">Likes: ${post.likes}</p>
                        <button type="button" class="like-btn" data-id="${post.id}">Add Like</button>
                    `;
                    postsContainer.appendChild(postDiv);

                    const likeBtn = postDiv.querySelector(".like-btn");
                    likeBtn.addEventListener("click", async () => {
                        const postId = likeBtn.dataset.id;
                        const response = await fetch(`http://localhost:6767/posts/${postId}/like`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' }
                        });
                        if (response.ok) {
                            const data = await response.json();
                            const likesDisplay = document.querySelector(`#likes-display-${postId}`);
                            if (likesDisplay) {
                                likesDisplay.textContent = `Likes: ${data.likes}`;
                            }
                        }
                    });
                }
            } catch (err) {
                console.error("Error loading posts: ", err);
            }
        }
        const form = document.querySelector("#create-post-form");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const title = document.querySelector("#title").value;
            const content = document.querySelector("#content").value;
            const user_id = document.querySelector("#user_id").value;

            const postData = { title, content, user_id };

            try {
                const response = await fetch("http://localhost:6767/posts", {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(postData)
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || "Erro ao criar post");
                }
                form.reset();
                await loadPosts();
            } catch (error) {
                console.error("Error uploading:", error);
                alert(`Erro creating post:  ${error.message}`);
            }
        });
        loadPosts();
    </script>
</body>
</html>
